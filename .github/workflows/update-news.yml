# NewsPortal - runs on GitHub's servers (free), publishes to GitHub Pages.
# All cron times are UTC.  Nepal = UTC + 5:45.
name: Update NewsPortal

on:
  schedule:
    # All cron times are UTC; Nepal = UTC + 5:45.  Runs start a few minutes past the hour on purpose
    # (:06 :21 :36 :51 Nepal-clock-wise) because GitHub delays or skips runs at busy minutes (:00 :30).
    #
    # NEPSE trades Monday-Friday (Saturday and Sunday closed).  Schedule in Nepal time:
    #   Mon-Fri  06:00-20:00        every 15 minutes   (market day, most news)
    #   Sat/Sun  06:00-20:00        every 60 minutes   (market closed, little news)
    #   Every day, night            only 20:00, 22:00, 02:00 and 06:00   (about :06 past each)
    #
    # 06:06 NPT = 00:21 UTC (same weekday), 20:06 NPT = 14:21 UTC, 22:06 NPT = 16:21 UTC,
    # 02:06 NPT (next day) = 20:21 UTC.
    # Mon-Fri, 06:06 -> 20:06 NPT, every 15 minutes (cron days 1-5)
    - cron: "21,36,51 0 * * 1-5"        # 06:06 06:21 06:36 NPT
    - cron: "6,21,36,51 1-13 * * 1-5"   # 06:51 ... 19:36 NPT
    - cron: "6,21 14 * * 1-5"           # 19:51 and 20:06 NPT (20:06 = the 8 PM run)
    # Sat + Sun (cron days 6 and 0), 06:06 -> 20:06 NPT, once an hour
    - cron: "21 0-14 * * 0,6"
    # Every day: night runs at 22:06 and 02:06 NPT (06:06 and 20:06 are covered above)
    - cron: "21 16,20 * * *"
  workflow_dispatch:          # lets you press "Run workflow" yourself
  push:                       # re-publish right after you upload a new screener file
    paths:
      - screener_public.json
      - nepse_news_hub.py
      - manual_headlines.txt

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write              # only used to keep the schedule from being auto-disabled

concurrency:
  group: newsportal
  # true = a newer run cancels a stuck/older one, so one stuck deploy can never block every later run
  # (each run rebuilds the whole site, so cancelling an old run loses nothing)
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      # Only the news database is remembered between runs (settings/sources come from the repo)
      - name: Restore news database
        uses: actions/cache/restore@v4
        with:
          path: data/nepse_news.db*
          key: newsdb-${{ github.run_id }}
          restore-keys: newsdb-

      - name: Collect latest news
        id: collect
        run: set -o pipefail; python nepse_news_hub.py collect | tee collect_summary.txt
        timeout-minutes: 7           # a hanging site must not hold up the next scheduled run
        continue-on-error: true      # one bad source must not stop the update
        env:
          # Without this, a source checked <15 min ago is skipped, so a 15-minute schedule could
          # skip every other run if one starts a few seconds early.  12 = always a few minutes
          # shorter than the shortest gap between runs (15).  Requests stay light: conditional GET
          # (ETag / If-Modified-Since) where the site supports it.
          NNH_MIN_INTERVAL_MIN: "12"
          NNH_CONTACT: ${{ secrets.NNH_CONTACT }}
          # Delete articles older than this many days (minimum 7).  Excluded/irrelevant items are always
          # deleted after 7 days.  Keeps the database (and the 10 GB cache budget) from growing forever.
          NNH_RETENTION_DAYS: "90"

      # Headlines you typed into manual_headlines.txt (portals that do not allow automated access)
      - name: Add manual headlines
        run: python nepse_news_hub.py manual-import
        continue-on-error: true

      - name: Save news database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/nepse_news.db*
          key: newsdb-${{ github.run_id }}

      - name: Build public site (headlines + links only)
        run: python nepse_news_hub.py publish
        env:
          NNH_CONTACT: ${{ secrets.NNH_CONTACT }}

      - name: Check the page is not empty
        run: test "$(wc -c < public_site/index.html)" -gt 20000

      # Shows on the run's summary page: how much space the site and the database use
      - name: Storage report
        if: always()
        run: |
          {
            echo "### Storage report"
            echo "- Published site folder: $(du -sh public_site 2>/dev/null | cut -f1)  (GitHub Pages limit: 1 GB)"
            echo "- index.html: $(du -h public_site/index.html 2>/dev/null | cut -f1)"
            echo "- News database files: $(du -ch data/nepse_news.db* 2>/dev/null | tail -1 | cut -f1)  (cache limit: 10 GB for the whole repo)"
          } >> "$GITHUB_STEP_SUMMARY"
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY' || true
          import sqlite3
          c = sqlite3.connect("data/nepse_news.db")
          n, old, new = c.execute("SELECT COUNT(*), MIN(sort_at), MAX(sort_at) FROM articles").fetchone()
          ex = c.execute("SELECT COUNT(*) FROM articles WHERE relevance='excluded'").fetchone()[0]
          seen = c.execute("SELECT COUNT(*) FROM seen").fetchone()[0]
          pages = c.execute("PRAGMA page_count").fetchone()[0]
          free = c.execute("PRAGMA freelist_count").fetchone()[0]
          print(f"- Articles in database: {n:,} ({ex:,} excluded) - oldest {(old or '-')[:10]}, newest {(new or '-')[:10]}")
          print(f"- Seen-URL table: {seen:,} rows - empty space inside the file: {free * 100 // max(pages, 1)}%")
          PY

      # Shows on the run's summary page: when it was built and what collection did
      - name: Run summary
        if: always()
        run: |
          {
            echo "### NewsPortal build"
            echo "- Built (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Collect step: ${{ steps.collect.outcome }}"
            echo "- Page version: $(cat public_site/version.json 2>/dev/null)"
            echo '```'
            head -n 8 collect_summary.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public_site

      # Best effort: resets GitHub's 60-day inactivity timer for scheduled workflows
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-news.yml/enable" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10          # a stuck Pages deployment must not block every later run (they share one queue)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
